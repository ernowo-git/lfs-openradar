# Disable this for local recording, input telemetry, and the G-meter without InSim.
insim_enabled = true
# Local LFS client. Enable its listener by typing /insim 29999 in LFS.
overlay_backend = "auto" # or "window" / "wayland" to override; see docs/native-wayland.md
insim_address = "127.0.0.1:29999"
# Local LFS Game Admin password (plain text). LFS_INSIM_ADMIN overrides it at launch.
insim_password = ""
# Optional: folder containing LFS.exe, remembered by the startup setup controls.
# This setting alone does not change LFS; use Enable InSim at startup in the panel.
lfs_directory = ""
outsim_bind = "127.0.0.1:30000"
# Optional Speed dashboard and Fuel telemetry; both share this UDP endpoint.
outgauge_bind = "127.0.0.1:30001"
outgauge_id = 24602
# Optional UDP forwarding, active even with Speed dashboard and Fuel disabled.
# For MOZA, set outgauge_id = 0 here and in LFS, then uncomment this line.
# Add more addresses to send the same packets to other local telemetry apps.
# outgauge_forward = ["127.0.0.1:60000", "127.0.0.1:60001"]
# RPM bar starts alternating red/blue at this percentage (1..100).
rpm_blink_threshold_percent = 95
# Time per blink color (50..500 ms); lower values blink faster.
rpm_blink_interval_ms = 100
# Horizontal G-meter radius: 1, 2, 3, or 4 G. Takes effect without reconnecting.
g_force_range_g = 3
# Decimal 511 = LFS OutSim Opts 1ff (hexadecimal), including gadget input data.
outsim_options = 511
outsim_id = 24601
mci_interval_ms = 20
interpolation_ms = 60
stale_ms = 250
hide_ms = 500
side_m = 5.0
front_m = 8.0
rear_m = 7.0
height_m = 3.0
car_width_m = 1.8
car_length_m = 4.2
overlay_x = 40.0
overlay_y = 160.0
overlay_size = 320.0
# GT is the sole HUD style; legacy "classic" values load as GT.
hud_style = "gt"
# Show passage-history and estimate diagnostics in gap gadgets.
hud_debug = false
hide_when_background = true
# Show overlays shortcut. Global on Windows; panel must have focus elsewhere.
# Supported: Insert, Delete, Home, End, PageUp, PageDown, Space, Enter, Escape,
# Tab, Backspace, F1..F24, A..Z, 0..9. Use "None" to disable. Restart after editing.
overlay_toggle_key = "Insert"
# Follow the watched AI/human in live single player (cockpit/custom view).
# Multiplayer still requires your own human car. Replays are unsupported.
follow_viewed_car = false
radar_enabled = true
# Wait 2 seconds without warnings, then fade out over 300 ms.
radar_auto_hide = false

# Central horizontal G-meter; trail and measured peaks stay in memory only.
[g_force]
enabled = false
window_x = 580.0
window_y = 360.0
scale = 1.0

# Steering and pedals with five seconds of throttle/brake history.
[inputs]
enabled = false
window_x = 580.0
window_y = 740.0
scale = 1.0

# Each gap has its own overlay window. Positions are logical screen pixels.
[gap_ahead]
enabled = false
window_x = 376.0
window_y = 160.0
scale = 1.0

[gap_behind]
enabled = false
window_x = 376.0
window_y = 260.0
scale = 1.0

[performance_delta]
enabled = false
window_x = 376.0
window_y = 360.0
scale = 1.0

# Independent speed/RPM/gear/indicator overlay.
[speed_dashboard]
enabled = false
window_x = 376.0
window_y = 520.0
scale = 1.0

# Independent fuel level, range, and additional fuel needed to finish.
[fuel]
enabled = false
window_x = 376.0
window_y = 746.0
scale = 1.0

# PB cumulative splits and independent best sectors, saved per track and car.
[lap_records]
enabled = false
window_x = 376.0
window_y = 986.0
scale = 1.0

# Latest eight session laps; history is kept only in memory.
[lap_log]
enabled = false
window_x = 1100.0
window_y = 260.0
scale = 1.0

# On-track traffic: 3 ahead, you, 3 behind. Uses InSim without requiring OutSim.
[relative]
enabled = false
window_x = 24.0
window_y = 360.0
scale = 1.0

# Car settings by LFS car code (or six-digit vehicle mod ID).
[cars.XFG]
name = "XF GTI"
max_rpm = 8000
# Optional cockpit-wheel / road-wheel steering ratio. XFG automatically uses 15:1.
# steering_ratio = 15.0
