# Local LFS client. Enable its listener by typing /insim 29999 in LFS.
insim_address = "127.0.0.1:29999"
# Local LFS Game Admin password (plain text). LFS_INSIM_ADMIN overrides it at launch.
insim_password = ""
# Optional: folder containing LFS.exe, remembered by the startup setup controls.
# This setting alone does not change LFS; use Enable InSim at startup in the panel.
lfs_directory = ""
outsim_bind = "127.0.0.1:30000"
# Optional Speed dashboard and Fuel telemetry; both share this UDP endpoint.
outgauge_bind = "127.0.0.1:30001"
outgauge_id = 24602
# Optional UDP forwarding, active even with Speed dashboard and Fuel disabled.
# For MOZA, set outgauge_id = 0 here and in LFS, then uncomment this line.
# Add more addresses to send the same packets to other local telemetry apps.
# outgauge_forward = ["127.0.0.1:60000", "127.0.0.1:60001"]
# RPM bar starts alternating red/blue at this percentage (1..100).
rpm_blink_threshold_percent = 95
# Time per blink color (50..500 ms); lower values blink faster.
rpm_blink_interval_ms = 100
# Decimal 511 = LFS OutSim Opts 1ff (hexadecimal), full LFST packet.
outsim_options = 511
outsim_id = 24601
mci_interval_ms = 20
interpolation_ms = 60
stale_ms = 250
hide_ms = 500
side_m = 5.0
front_m = 8.0
rear_m = 7.0
height_m = 3.0
car_width_m = 1.8
car_length_m = 4.2
overlay_x = 40.0
overlay_y = 160.0
overlay_size = 320.0
# Built-in HUD appearance: "gt" (default) or "classic". Changes apply immediately.
hud_style = "gt"
# Show passage-history and estimate diagnostics in gap gadgets for either HUD style.
hud_debug = false
hide_when_background = true
# Show overlays shortcut. Global on Windows; panel must have focus elsewhere.
# Supported: Insert, Delete, Home, End, PageUp, PageDown, Space, Enter, Escape,
# Tab, Backspace, F1..F24, A..Z, 0..9. Use "None" to disable. Restart after editing.
overlay_toggle_key = "Insert"
# Follow the watched AI/human in live single player (cockpit/custom view).
# Multiplayer still requires your own human car. Replays are unsupported.
follow_viewed_car = false
radar_enabled = true

# Each gap has its own overlay window. Positions are logical screen pixels.
[gap_ahead]
enabled = false
window_x = 376.0
window_y = 160.0
scale = 1.0

[gap_behind]
enabled = false
window_x = 376.0
window_y = 260.0
scale = 1.0

[performance_delta]
enabled = false
window_x = 376.0
window_y = 360.0
scale = 1.0

# Independent speed/RPM/gear/indicator overlay.
[speed_dashboard]
enabled = false
window_x = 376.0
window_y = 520.0
scale = 1.0

# Independent fuel level, range, and additional fuel needed to finish.
[fuel]
enabled = false
window_x = 376.0
window_y = 746.0
scale = 1.0

# Car settings by LFS car code (or six-digit vehicle mod ID).
[cars.XFG]
name = "XF GTI"
max_rpm = 8000
