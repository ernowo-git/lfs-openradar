name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.0'
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libudev-dev
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/eframe/**') }}
      - name: Validate package version and lockfile
        run: python .github/scripts/release.py check
      - name: Test release automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Check formatting
        run: cargo fmt --check
      - name: Check compilation
        run: cargo check --locked
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run desktop tests
        run: cargo test --locked
      - name: Run headless tests
        run: cargo test --no-default-features --locked
